# =====================================================
# UPDATE GAMES.JSON + VOCABULARY
#
# Repository: caokydn/juni
#
# Quy tắc:
# 1. Lấy tất cả repository public của caokydn.
# 2. Chỉ repository kết thúc bằng số 1
#    mới quét folder flashcard.
# 3. Repository kết thúc bằng 2, 3, 4, 5, 6
#    không quét flashcard.
# 4. Repository không kết thúc bằng số
#    vẫn được đưa vào games.json, vocab = [].
# 5. Chấp nhận file jpg, jpeg, png.
# =====================================================

name: Update Games JSON

on:
  # Chạy tự động mỗi 60 phút
  schedule:
    - cron: "0 * * * *"

  # Cho phép chạy thủ công
  workflow_dispatch:

jobs:
  update-games:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository juni
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Lấy danh sách repository và vocabulary
      - name: Get repositories and vocabulary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import os

          # Thông tin GitHub
          username = "caokydn"
          token = os.environ.get("GH_TOKEN")

          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          if token:
              headers["Authorization"] = f"Bearer {token}"

          # Hàm gọi GitHub API
          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, json.load(response)

              except urllib.error.HTTPError as error:
                  print(
                      f"GitHub API error {error.code}: {url}"
                  )
                  return error.code, None

          # 1. Lấy tất cả repository public
          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              print(f"Getting repository page {page}...")

              status, data = github_get(url)

              if status != 200:
                  raise RuntimeError(
                      "Could not get repositories."
                  )

              if not data:
                  break

              for repo in data:
                  if repo.get("private", False):
                      continue

                  repos.append(repo["name"])

              page += 1

          print(f"Found {len(repos)} public repositories.")

          # 2. Sắp xếp repository
          repos.sort(key=lambda x: x.lower())

          # 3. Tạo dữ liệu games.json
          games = {}

          # 4. Xử lý từng repository
          for index, repo_name in enumerate(repos, start=1):
              print(f"\n[{index}/{len(repos)}] {repo_name}")

              vocab = []

              # Chỉ quét repository kết thúc bằng số 1
              if repo_name.endswith("1"):
                  print("  -> Checking flashcard...")

                  url = (
                      f"https://api.github.com/repos/"
                      f"{username}/{repo_name}/contents/flashcard"
                  )

                  status, data = github_get(url)

                  if status == 200 and isinstance(data, list):
                      for item in data:
                          if item.get("type") != "file":
                              continue

                          filename = item.get("name", "")
                          lower_name = filename.lower()

                          if lower_name.endswith(".jpeg"):
                              word = filename[:-5]
                          elif lower_name.endswith(".jpg"):
                              word = filename[:-4]
                          elif lower_name.endswith(".png"):
                              word = filename[:-4]
                          else:
                              continue

                          if word:
                              vocab.append(word)

                      vocab.sort(key=lambda x: x.lower())

                      print(
                          f"  -> Found {len(vocab)} vocabulary."
                      )

                  elif status == 404:
                      print("  -> No flashcard folder.")

                  else:
                      raise RuntimeError(
                          f"Cannot read flashcard in {repo_name}, "
                          f"HTTP {status}"
                      )

              else:
                  print("  -> Skip vocabulary scan.")

              # 5. Lưu repository
              games[repo_name] = {
                  "vocab": vocab
              }

          # 6. Ghi games.json
          with open("games.json", "w", encoding="utf-8") as file:
              json.dump(
                  games,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          # 7. Thống kê
          scanned = sum(
              1 for repo in repos if repo.endswith("1")
          )

          vocab_count = sum(
              len(data["vocab"])
              for data in games.values()
          )

          print("\n======================================")
          print("GAMES.JSON UPDATED")
          print("======================================")
          print(f"Total repositories: {len(repos)}")
          print(f"Repositories scanned: {scanned}")
          print(f"Total vocabulary: {vocab_count}")
          print("======================================")
          PY

      # 3. Hiển thị games.json
      - name: Show games.json
        run: |
          echo "================================"
          echo "games.json"
          echo "================================"
          cat games.json

      # 4. Kiểm tra JSON
      - name: Validate games.json
        run: |
          python -m json.tool games.json > /dev/null
          echo "games.json is valid JSON."

      # 5. Commit nếu có thay đổi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "No changes to games.json."
          else
            git commit -m "Update games.json"
            git push
          fi
